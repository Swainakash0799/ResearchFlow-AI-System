name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --dev

      - name: Check API keys exist
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "GROQ_API_KEY is NOT available"
            exit 1
          else
            echo "GROQ_API_KEY is available"
          fi

          if [ -z "$TAVILY_API_KEY" ]; then
            echo "TAVILY_API_KEY is NOT available"
            exit 1
          else
            echo "TAVILY_API_KEY is available"
          fi

      - name: Run tests
        run: uv run pytest